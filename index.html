<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR.MED PRO SYSTEM</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 text-slate-800 pb-20">

  <div class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Header / Doctor Profile Card -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xl font-bold">
          <i data-lucide="user-check"></i>
        </div>
        <div>
          <h2 id="docName" class="font-bold text-slate-900 leading-tight"> Asrorov Asadbek</h2>
          <p id="docSpec" class="text-xs text-blue-600 font-medium">Shifokor-Terapevt</p>
          <p class="text-[10px] text-slate-400">ID: <span id="docId">012345</span></p>
        </div>
      </div>
      <div class="text-right">
        <span class="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
        <p class="text-[10px] text-emerald-600 font-medium">Tizim faol</p>
      </div>
    </div>

    <!-- Main Form -->
    <form id="recipeForm" class="space-y-5">

      <!-- Step 1: Bemor ma'lumotlari -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex items-center justify-between border-b pb-2 border-slate-100">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2">
            <i data-lucide="user" class="w-4 h-4 text-blue-600"></i> Bemor ma'lumotlari
          </h3>
          <span class="text-xs text-slate-400">1/3-qadam</span>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">F.I.O. (To'liq)</label>
          <input type="text" id="patientName" required placeholder="Aliyev Vali Toshmatovich"
            class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Yoshi</label>
            <input type="number" id="patientAge" required placeholder="28"
              class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Jinsi</label>
            <select id="patientGender" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm bg-white">
              <option value="Erkak">Erkak</option>
              <option value="Ayol">Ayol</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Tashxis / Klinik xulosa</label>
          <input type="text" id="diagnosis" required placeholder="O'tkir retsidivlanuvchi bronxit"
            class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
        </div>
      </div>

      <!-- Step 2: Dori-darmonlar -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex items-center justify-between border-b pb-2 border-slate-100">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2">
            <i data-lucide="pill" class="w-4 h-4 text-blue-600"></i> Tayinlangan dorilar
          </h3>
          <button type="button" id="addMedBtn" class="text-xs font-semibold text-blue-600 hover:text-blue-700 flex items-center gap-1 bg-blue-50 px-2.5 py-1 rounded-lg">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Qo'shish
          </button>
        </div>

        <div id="medicationsList" class="space-y-3">
          <!-- Dynamic Medication Items -->
        </div>
      </div>

      <!-- Step 3: Tavsiyalar -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2 border-b pb-2 border-slate-100">
          <i data-lucide="clipboard-list" class="w-4 h-4 text-blue-600"></i> Shifokor tavsiyasi
        </h3>
        <textarea id="notes" rows="3" placeholder="Iliq suyuqlik ko'proq ichilsin, 5 kun parhez saqlansin..."
          class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm resize-none"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/25 transition duration-150 flex items-center justify-center gap-2 text-sm">
        <i data-lucide="send" class="w-4 h-4"></i> Retseptni tasdiqlash va yuborish
      </button>

    </form>
  </div>

  <!-- Template for Medication Item -->
  <template id="medTemplate">
    <div class="med-item p-3 border border-slate-200/80 rounded-xl bg-slate-50/50 space-y-2.5 relative group">
      <button type="button" class="remove-med-btn absolute top-2 right-2 text-slate-400 hover:text-red-500 p-1">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Dori nomi va dozasi</label>
        <input type="text" class="med-name w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:outline-none focus:border-blue-500" required placeholder="Masalan: Amoksiklav 1000mg">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Qabul qilish tartibi</label>
          <input type="text" class="med-dosage w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:outline-none focus:border-blue-500" required placeholder="1 tab x 2 mahal">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Muddati (kun)</label>
          <input type="text" class="med-duration w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:outline-none focus:border-blue-500" required placeholder="7 kun">
        </div>
      </div>
    </div>
  </template>

  <!-- External JavaScript file -->
  <script src="app.js"></script>
</body>
</html>
