<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retsept yozish - DR.MED</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --hint-color: #64748b;
      --primary-color: #0d9488;
      --border-color: #e2e8f0;
    }

    body { 
      background-color: var(--bg-color); 
      color: var(--text-color); 
      padding: 16px; 
      padding-bottom: 90px;
    }
    
    .header-sub { font-size: 11px; color: var(--primary-color); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 12px; }

    .section-title { 
      font-size: 12px; 
      font-weight: 700; 
      color: var(--primary-color); 
      text-transform: uppercase; 
      margin: 16px 0 8px 0; 
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card { 
      background: var(--card-bg); 
      padding: 14px; 
      border-radius: 12px; 
      border: 1px solid var(--border-color);
      margin-bottom: 12px; 
    }

    .form-group { margin-bottom: 10px; }
    .form-group:last-child { margin-bottom: 0; }
    
    .form-group label { 
      display: block; 
      font-size: 12px; 
      font-weight: 600; 
      color: #334155; 
      margin-bottom: 4px; 
    }
    
    .form-group input, .form-group textarea {
      width: 100%; 
      padding: 10px 12px; 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      font-size: 13px; 
      outline: none; 
      transition: 0.2s;
      background: #ffffff;
      color: var(--text-color);
    }
    
    .form-group input:focus, .form-group textarea:focus { 
      border-color: var(--primary-color); 
    }

    .row { display: flex; gap: 8px; }
    .col { flex: 1; }

    /* Gender Toggle */
    .gender-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
    .gender-btn {
      flex: 1;
      padding: 9px;
      border: 1px solid var(--border-color);
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      text-align: center;
    }
    .gender-btn.active {
      border-color: var(--primary-color);
      color: var(--primary-color);
      background: rgba(13, 148, 136, 0.05);
    }

    .medicine-item {
      position: relative;
      background: rgba(13, 148, 136, 0.03);
      border: 1px dashed var(--primary-color);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .btn-add {
      width: 100%;
      background: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header-sub">Retsept yozish</div>
  <div class="header-title">Bemor ma'lumotlari & Tayinlov</div>

  <form id="recipeForm">
    <!-- BEMOR MA'LUMOTLARI -->
    <div class="section-title">👤 BEMOR MA'LUMOTLARI</div>
    <div class="card">
      <div class="form-group">
        <label>F.I.Sh.</label>
        <input type="text" id="patient_name" placeholder="Asadbek Xolmirzayev" required>
      </div>
      
      <div class="row">
        <div class="col form-group">
          <label>Tug'ilgan sanasi</label>
          <input type="text" id="birth_date" placeholder="12.05.2004">
        </div>
        <div class="col form-group">
          <label>Yoshi</label>
          <input type="number" id="age" placeholder="20" required>
        </div>
      </div>

      <div class="form-group">
        <label>Jinsi</label>
        <div class="gender-toggle">
          <div class="gender-btn active" id="btn_erkak" onclick="setGender('Erkak')">Erkak</div>
          <div class="gender-btn" id="btn_ayol" onclick="setGender('Ayol')">Ayol</div>
        </div>
      </div>

      <div class="form-group">
        <label>Manzili (ixtiyoriy)</label>
        <input type="text" id="address" placeholder="Toshkent sh., Chilonzor tumani">
      </div>

      <div class="form-group">
        <label>Ambulator karta №</label>
        <input type="text" id="card_num" placeholder="A-123456">
      </div>
    </div>

    <!-- DIAGNOZ -->
    <div class="section-title">🩺 DIAGNOZ</div>
    <div class="card">
      <div class="form-group">
        <label>ICD-10 kodi va Tashxis</label>
        <textarea id="diagnosis" rows="2" placeholder="J20.9 - O'tkir bronxit, aniqlanmagan qo'zg'atuvchi bilan" required></textarea>
      </div>
    </div>

    <!-- TAYINLANGAN DORILAR -->
    <div class="section-title">💊 TAYINLANGAN DORILAR (Rp)</div>
    <div class="card">
      <div id="medicinesContainer">
        <div class="medicine-item">
          <div class="form-group">
            <input type="text" class="med-name" placeholder="Dori nomi (masalan: Tab. Amoxicillini 0,5)" required>
          </div>
          <div class="form-group">
            <input type="text" class="med-dose" placeholder="D.t.d va Qabul qilish (masalan: 1 tadan 3 mahal, 7 kun)" required>
          </div>
        </div>
      </div>
      <button type="button" class="btn-add" id="addMedBtn">➕ Boshqa dori qo'shish</button>
    </div>

    <!-- QO'SHIMCHA MA'LUMOT -->
    <div class="section-title">🔍 QO'SHIMCHA MA'LUMOT</div>
    <div class="card">
      <div class="form-group">
        <label>Allergiyasi (ixtiyoriy)</label>
        <input type="text" id="allergy" placeholder="Yo'q">
      </div>
      <div class="form-group">
        <label>Izoh (ixtiyoriy)</label>
        <input type="text" id="note" placeholder="Harorat 37.8°C, yo'tal, balg'am bilan.">
      </div>
    </div>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    tg.MainButton.setText("KEYINGI BOSQICH ➔");
    tg.MainButton.setTextColor("#FFFFFF");
    tg.MainButton.setColor("#0d9488");
    tg.MainButton.show();

    let selectedGender = "Erkak";

    function setGender(gender) {
      selectedGender = gender;
      document.getElementById('btn_erkak').classList.toggle('active', gender === 'Erkak');
      document.getElementById('btn_ayol').classList.toggle('active', gender === 'Ayol');
    }

    const medContainer = document.getElementById('medicinesContainer');
    const addMedBtn = document.getElementById('addMedBtn');
    let medCount = 1;

    addMedBtn.addEventListener('click', () => {
      medCount++;
      const medDiv = document.createElement('div');
      medDiv.className = 'medicine-item';
      medDiv.innerHTML = `
        <div class="form-group">
          <input type="text" class="med-name" placeholder="${medCount}-dori nomi" required>
        </div>
        <div class="form-group">
          <input type="text" class="med-dose" placeholder="Qabul qilish tartibi" required>
        </div>
      `;
      medContainer.appendChild(medDiv);
    });

    tg.MainButton.onClick(function() {
      const patientName = document.getElementById('patient_name').value.trim();
      const age = document.getElementById('age').value.trim();
      const diagnosis = document.getElementById('diagnosis').value.trim();

      if (!patientName || !age || !diagnosis) {
        tg.showAlert("Iltimos, bemor ismi, yoshi va tashxisini kiriting!");
        return;
      }

      const medNames = document.querySelectorAll('.med-name');
      const medDoses = document.querySelectorAll('.med-dose');
      let medicinesList = [];

      medNames.forEach((input, index) => {
        const name = input.value.trim();
        const dose = medDoses[index].value.trim();
        if (name) {
          medicinesList.push({ name: name, dose: dose });
        }
      });

      if (medicinesList.length === 0) {
        tg.showAlert("Kamida bitta dori kiritishingiz kerak!");
        return;
      }

      const data = {
        patient_name: patientName,
        birth_date: document.getElementById('birth_date').value.trim() || "-",
        age: age,
        gender: selectedGender,
        address: document.getElementById('address').value.trim() || "-",
        card_num: document.getElementById('card_num').value.trim() || "-",
        diagnosis: diagnosis,
        medicines: medicinesList,
        allergy: document.getElementById('allergy').value.trim() || "Yo'q",
        note: document.getElementById('note').value.trim() || "-"
      };

      tg.sendData(JSON.stringify(data));
    });
  </script>
</body>
</html>
